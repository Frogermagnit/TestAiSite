<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Refiner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --accent-color: #2f2f37;
            --text-color: #e2e2e4;
            --text-muted: #88888c;
            --border-color: #2a2a30;
            --button-bg: #121214;
            --button-hover: #1e1e24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Overpass Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000000;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-field {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 4px;
            outline: none;
            resize: vertical;
        }

        .input-field:focus {
            border-color: var(--text-muted);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pane h2 {
            font-size: 1rem;
            color: var(--text-muted);
        }

        textarea.input-field {
            height: 250px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
        }

        button {
            font-family: inherit;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: var(--button-hover);
            border-color: var(--text-muted);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>PROMPT_REPHRASER //</h1>
    </header>

    <main>
        <div class="workspace">
            <div class="pane">
                <h2>Ввод пользователя</h2>
                <textarea id="userInput" class="input-field" placeholder="Например: темный сайт для портфолио разработчика, monospace шрифт, минимализм..."></textarea>
            </div>
            
            <div class="pane">
                <h2>Улучшенный промпт для UI/UX дизайна</h2>
                <textarea id="outputPrompt" class="input-field" readonly placeholder="Здесь появится результат..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button id="processBtn">Оптимизировать запрос</button>
        </div>
        
        <div id="statusMessage" class="status"></div>
    </main>

    <script>
        
        const SHARED_API_KEY = "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";

        const SYSTEM_PROMPT = `Ты — ведущий UI/UX архитектор и профессиональный инженер промптов для генераторов веб-интерфейсов. Твоя цель — взять короткую, хаотичную или сырую идею пользователя и превратить её в идеальный, технически детализированный промпт для большой языковой модели или нейросети, которая создает дизайн сайтов.

Правила формирования улучшенного промпта:
1. Роль и Контекст: Всегда начинай с указания роли, например: "Действуй как профессиональный UI/UX дизайнер..." или "Разработай концепт современного интерфейса для...".
2. Структурирование по блокам: Промпт должен включать стиль, цветовую палитру (с HEX), сетку/лейаут, элементы UI и типографику (желательно Monospace, например 'Overpass Mono').
3. Точность: Убирай «воду». Делай требования к дизайну конкретными.
4. Важно: Сохраняй изначальную суть идеи пользователя.
5. Выводи ТОЛЬКО получившийся готовый текст промпта, без приветствий, вступлений и комментариев.`;

        const userInput = document.getElementById('userInput');
        const outputPrompt = document.getElementById('outputPrompt');
        const processBtn = document.getElementById('processBtn');
        const statusMessage = document.getElementById('statusMessage');

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function fetchParaphrase() {
            const text = userInput.value.trim();

            if (!text) {
                statusMessage.textContent = "Ошибка: Введите текст для перефразирования.";
                return;
            }

            processBtn.disabled = true;
            outputPrompt.value = "";

            // ТВОЙ ИСХОДНЫЙ СПИСОК МОДЕЛЕЙ БЕЗ ИЗМЕНЕНИЙ
            const models = [
                'meta-llama/llama-3.2-3b-instruct:free',
                'deepseek/deepseek-v4-flash:free',
                'google/gemma-4-26b-a4b-it:free'
            ];

            const startTime = Date.now();
            const timeoutDuration = 30000; // 30 секунд лимит перебора
            let success = false;
            let attemptCount = 1;

            while (Date.now() - startTime < timeoutDuration && !success) {
                
                for (let i = 0; i < models.length; i++) {
                    if (Date.now() - startTime >= timeoutDuration) break;

                    const currentModel = models[i];
                    const timeLeft = Math.round((timeoutDuration - (Date.now() - startTime)) / 1000);
                    
                    statusMessage.textContent = `Попытка [Круг ${attemptCount}] | Модель: ${currentModel.split('/')[1]} | Осталось времени: ${timeLeft} сек...`;

                    try {
                        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${SHARED_API_KEY}`,
                                'HTTP-Referer': window.location.href,
                                'X-Title': 'Prompt Rephraser'
                            },
                            body: JSON.stringify({
                                model: currentModel, 
                                messages: [
                                    { role: 'system', content: SYSTEM_PROMPT },
                                    { role: 'user', content: text }
                                ],
                                temperature: 0.3
                            })
                        });

                        // Безопасное чтение JSON-ответа
                        const contentType = response.headers.get("content-type");
                        if (!contentType || !contentType.includes("application/json")) {
                            throw new Error("Произошел текстовый сбой провайдера");
                        }

                        const data = await response.json();

                        if (!response.ok || (data.error && (data.error.message.includes('Provider') || data.error.code === 503 || data.error.code === 400))) {
                            throw new Error(data.error?.message || `Ошибка сервера`);
                        }

                        outputPrompt.value = data.choices[0].message.content.trim();
                        statusMessage.textContent = "Готово.";
                        success = true;
                        break; 

                    } catch (error) {
                        console.warn(`Модель ${currentModel} сбросила запрос на круге ${attemptCount}: ${error.message}`);
                    }
                }

                // Пауза 2 секунды между кругами опроса
                if (!success && (Date.now() - startTime < timeoutDuration)) {
                    statusMessage.textContent = `Модели перегружены. Повторный запуск круга через 2 секунды...`;
                    await delay(2000);
                    attemptCount++;
                }
            }
            
            if (!success) {
                statusMessage.textContent = `Ошибка: Не удалось получить ответ от моделей за 30 секунд. Попробуйте еще раз.`;
            }

            processBtn.disabled = false;
        }

        processBtn.addEventListener('click', fetchParaphrase);
    </script>
</body>
</html>
