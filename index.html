<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Refiner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --accent-color: #2f2f37;
            --text-color: #e2e2e4;
            --text-muted: #88888c;
            --border-color: #2a2a30;
            --button-bg: #121214; /* Кнопки в цвет основного фона */
            --button-hover: #1e1e24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Overpass Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000000; /* Черный хедер */
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-field {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 4px;
            outline: none;
            resize: vertical;
        }

        .input-field:focus {
            border-color: var(--text-muted);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pane h2 {
            font-size: 1rem;
            color: var(--text-muted);
        }

        textarea.input-field {
            height: 250px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
        }

        button {
            font-family: inherit;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: var(--button-hover);
            border-color: var(--text-muted);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>PROMPT_REPHRASER //</h1>
    </header>

    <main>
        <div class="workspace">
            <div class="pane">
                <h2>Ввод пользователя</h2>
                <textarea id="userInput" class="input-field" placeholder="Например: темный сайт для портфолио разработчика, monospace шрифт, минимализм..."></textarea>
            </div>
            
            <div class="pane">
                <h2>Улучшенный промпт для UI/UX дизайна</h2>
                <textarea id="outputPrompt" class="input-field" readonly placeholder="Здесь появится результат..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button id="processBtn">Оптимизировать запрос</button>
        </div>
        
        <div id="statusMessage" class="status"></div>
    </main>

    <script>
        const userInput = document.getElementById('userInput');
        const outputPrompt = document.getElementById('outputPrompt');
        const processBtn = document.getElementById('processBtn');
        const statusMessage = document.getElementById('statusMessage');

        async function fetchParaphrase() {
            const text = userInput.value.trim();

            if (!text) {
                statusMessage.textContent = "Ошибка: Введите текст для перефразирования.";
                return;
            }

            // Локальная проверка длины перед отправкой, чтобы не гонять сервер зря
            if (text.length > 1500) {
                statusMessage.textContent = "Ошибка: Текст слишком длинный (макс. 1500 символов).";
                return;
            }

            processBtn.disabled = true;
            outputPrompt.value = "";
            statusMessage.textContent = "Оптимизация промпта через сервер (лимит ожидания 30 сек)...";

            try {
                // Шлем запрос на нашу Serverless-функцию Vercel
                const response = await fetch('/api/paraphrase', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Произошла ошибка при обработке запроса.');
                }

                outputPrompt.value = data.result;
                statusMessage.textContent = "Готово.";

            } catch (error) {
                console.error(error);
                statusMessage.textContent = `Ошибка: ${error.message}`;
            } finally {
                processBtn.disabled = false;
            }
        }

        processBtn.addEventListener('click', fetchParaphrase);
    </script>
</body>
</html>
