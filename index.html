<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Refiner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --accent-color: #2f2f37;
            --text-color: #e2e2e4;
            --text-muted: #88888c;
            --border-color: #2a2a30;
            --button-bg: #121214; /* Кнопки в цвет основного фона */
            --button-hover: #1e1e24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Overpass Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000000; /* Черный хедер */
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .config-box {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .config-box label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 4px;
            outline: none;
            resize: vertical;
        }

        .input-field:focus {
            border-color: var(--text-muted);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pane h2 {
            font-size: 1rem;
            color: var(--text-muted);
        }

        textarea.input-field {
            height: 250px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
        }

        button {
            font-family: inherit;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: var(--button-hover);
            border-color: var(--text-muted);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>PROMPT_REPHRASER //</h1>
    </header>

    <main>
        <div class="config-box">
            <label for="apiKey">OPENROUTER API KEY (сохраняется локально в вашем браузере):</label>
            <input type="password" id="apiKey" class="input-field" placeholder="sk-or-v1-...">
        </div>

        <div class="workspace">
            <div class="pane">
                <h2>Ввод пользователя</h2>
                <textarea id="userInput" class="input-field" placeholder="Например: напиши код для змейки на c#..."></textarea>
            </div>
            
            <div class="pane">
                <h2>Улучшенный промпт</h2>
                <textarea id="outputPrompt" class="input-field" readonly placeholder="Здесь появится результат..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button id="processBtn">Оптимизировать запрос</button>
        </div>
        
        <div id="statusMessage" class="status"></div>
    </main>

    <script>
        const SYSTEM_PROMPT = `Ты — ведущий UI/UX архитектор и профессиональный инженер промптов для генераторов веб-интерфейсов. Твоя цель — взять короткую, хаотичную или сырую идею пользователя и превратить её в идеальный, технически детализированный промпт для большой языковой модели или нейросети, которая создает дизайн сайтов.

Правила формирования улучшенного промпта:
1. Роль и Контекст: Всегда начинай с указания роли, например: "Действуй как профессиональный UI/UX дизайнер..." или "Разработай концепт современного интерфейса для...".
2. Структурирование по блокам: Превращай запрос в четкую структуру. Промпт должен включать (если применимо):
   - Общая концепция и стиль (например, технический минимализм, брутализм, lo-fi эстетика, корпоративный стиль).
   - Цветовая палитра (конкретные HEX-коды или точные описания, например: "глубокий черный #000000 для хедера, темно-серый #121214 для основного фона").
   - Сетка и Лейаут (структура колонок, расположение элементов, фиксированные или адаптивные панели).
   - Элементы UI и навигация (кнопки, формы, инпуты, их состояния при ховере, поведение шрифтов).
   - Типографика (четкие указания семейств шрифтов, например, использование Monospace шрифтов вроде 'Overpass Mono' для кодовой эстетики или конкретных гротесков).
3. Точность: Убирай «воду». Делай требования к дизайну конкретными и понятными для выполнения ИИ-моделью.
4. Важно: Сохраняй изначальную суть идеи пользователя. Если пользователь просит темную тему — развивай темную тему, если просит минимализм — делай упор на свободное пространство и отсутствие лишнего декора.
5. Выводи ТОЛЬКО получившийся готовый текст промпта, без приветствий, вступлений, кавычек вокруг результата и твоих личных комментариев.`;

        const apiKeyInput = document.getElementById('apiKey');
        const userInput = document.getElementById('userInput');
        const outputPrompt = document.getElementById('outputPrompt');
        const processBtn = document.getElementById('processBtn');
        const statusMessage = document.getElementById('statusMessage');

        if (localStorage.getItem('saved_openrouter_key')) {
            apiKeyInput.value = localStorage.getItem('saved_openrouter_key');
        }

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('saved_openrouter_key', apiKeyInput.value.trim());
        });

        // Вспомогательная функция для паузы между кругами опроса
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function fetchParaphrase() {
            const key = apiKeyInput.value.trim();
            const text = userInput.value.trim();

            if (!key) {
                statusMessage.textContent = "Ошибка: Пожалуйста, введите ваш OpenRouter API ключ.";
                return;
            }
            if (!text) {
                statusMessage.textContent = "Ошибка: Введите текст для перефразирования.";
                return;
            }

            processBtn.disabled = true;
            outputPrompt.value = "";

            // Твой изначальный список бесплатных моделей с сайта
            const models = [
                'meta-llama/llama-3.2-3b-instruct:free',
                'deepseek/deepseek-v4-flash:free',
                'google/gemma-4-26b-a4b-it:free'
            ];

            const startTime = Date.now();
            const timeoutDuration = 30000; // 30 секунд лимит
            let success = false;
            let attemptCount = 1;

            // Крутим цикл, пока не пройдет 30 секунд или запрос не выполнится успешно
            while (Date.now() - startTime < timeoutDuration && !success) {
                
                for (let i = 0; i < models.length; i++) {
                    if (Date.now() - startTime >= timeoutDuration) break;

                    const currentModel = models[i];
                    const timeLeft = Math.round((timeoutDuration - (Date.now() - startTime)) / 1000);
                    
                    statusMessage.textContent = `Попытка [Круг ${attemptCount}] | Модель: ${currentModel.split('/')[1]} | Осталось времени: ${timeLeft} сек...`;

                    try {
                        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${key}`,
                                'HTTP-Referer': window.location.href,
                                'X-Title': 'Prompt Rephraser'
                            },
                            body: JSON.stringify({
                                model: currentModel, 
                                messages: [
                                    { role: 'system', content: SYSTEM_PROMPT },
                                    { role: 'user', content: text }
                                ],
                                temperature: 0.3
                            })
                        });

                        const data = await response.json();

                        // Если HTTP статус не ок ИЛИ в теле ответа есть ошибка провайдера/валидации
                        if (!response.ok || (data.error && (data.error.message.includes('Provider') || data.error.code === 503 || data.error.code === 400))) {
                            throw new Error(data.error?.message || `Ошибка сервера при работе с ${currentModel}`);
                        }

                        outputPrompt.value = data.choices[0].message.content.trim();
                        statusMessage.textContent = "Готово.";
                        success = true;
                        break; // Выход из внутреннего цикла по моделям

                    } catch (error) {
                        console.warn(`Модель ${currentModel} не ответила на круге ${attemptCount}. Ошибка:`, error.message);
                        // Просто идем дальше к следующей модели в списке
                    }
                }

                // Если все модели из списка вернули ошибку, но 30 секунд еще не прошло — ждем 2 секунды и идем на новый круг
                if (!success && (Date.now() - startTime < timeoutDuration)) {
                    statusMessage.textContent = `Все модели вернули ошибку. Повторный опрос через 2 секунды...`;
                    await delay(2000);
                    attemptCount++;
                }
            }
            
            // Если за 30 секунд ни одна модель не вернула успешный результат
            if (!success) {
                statusMessage.textContent = `Ошибка: Все выбранные бесплатные модели сейчас недоступны. Проверьте правильность API-ключа.`;
            }

            processBtn.disabled = false;
        }

        processBtn.addEventListener('click', fetchParaphrase);
    </script>
</body>
</html>
